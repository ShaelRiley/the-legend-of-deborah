name: MS3 song-first final validation
on:
  push:
    branches: [work/ms3-song-first]
    paths: [.github/workflows/ms3-song-validate.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg liblua5.4-0
      - run: python -m pip install Pillow==12.3.0 numpy playwright
      - name: Prepare real Chromium
        run: |
          if command -v google-chrome >/dev/null; then
            echo "MS3_CHROMIUM=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null; then
            echo "MS3_CHROMIUM=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
            python - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p: print('MS3_CHROMIUM='+p.chromium.executable_path)
          PY
          fi
      - name: Apply exact reviewed integration and remove transfer scaffolding
        run: |
          python - <<'PY'
          import base64,gzip,hashlib,subprocess
          from pathlib import Path
          parts=sorted(Path('.github').glob('ms3-song-integration.*.b64'))
          assert len(parts)==9
          data=gzip.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts),validate=True))
          assert hashlib.sha256(data).hexdigest()=='47f7504d4e89f2bab84ef4ba6b18cd9959aef4cdad57425816a37e1f11e7a8e2'
          subprocess.run(['git','apply','--check','-'],input=data,check=True)
          subprocess.run(['git','apply','-'],input=data,check=True)
          engine=Path('tools/music/ms2_engine.js').read_text()
          Path('gamemodes/legend_of_deborah/gamemode/lod/ms2/engine.lua').write_text('return [==['+engine+']==]\n')
          for p in Path('.github').glob('ms3-song*.b64'): p.unlink()
          for name in ('workbench','render','validate'):
            p=Path('.github/workflows/ms3-song-'+name+'.yml')
            if p.exists(): p.unlink()
          PY
          python tools/build_manual.py
          python - <<'PY'
          from pathlib import Path
          import hashlib
          assert hashlib.sha256(Path('docs/manual/manual.html').read_bytes()).hexdigest()=='800bc415e3bac515e9f848413a4e552a4c879987402824546c9bb8fc4d62c040'
          PY
          mkdir -p /tmp/ms3-song-validation
          git diff --check
      - name: Complete immutable game integration matrix
        run: python tools/test_checkpoint_g_integration.py --workers 4 --output /tmp/ms3-song-validation/integration 2>&1 | tee /tmp/ms3-song-validation/integration.log
      - name: Complete music gate
        run: python tools/test_music_gate.py --output /tmp/ms3-song-validation/music 2>&1 | tee /tmp/ms3-song-validation/music.log
      - name: Decode every actual recording
        run: node tools/test_music_audio.js 2>&1 | tee /tmp/ms3-song-validation/decode.log
      - name: Actual browser joins across every looping arrangement
        run: python tools/test_ms3_audio.py --bank 2>&1 | tee /tmp/ms3-song-validation/browser-pairs.log
      - name: Actual browser complete song traversal
        run: python tools/test_ms3_song_audio.py 2>&1 | tee /tmp/ms3-song-validation/browser-songs.log
      - name: Preserve exact verified candidate and evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          root=Path('/tmp/ms3-song-validation')
          integration=json.loads((root/'integration/receipt.json').read_text())
          music=json.loads((root/'music/receipt.json').read_text())
          assert integration['passed']==integration['total'] and not integration['changed_during_gate']
          assert music['passed']==music['total'] and not music['changed_during_gate']
          source=json.loads((root/'integration/source_manifest.json').read_text())
          assert all(Path(p).is_file() and hashlib.sha256(Path(p).read_bytes()).hexdigest()==h for p,h in source.items())
          def results(name):
            return [json.loads(line) for line in (root/name).read_text().splitlines() if line.startswith('{')]
          decoded=results('decode.log')[-1]
          assert decoded['actualDecodes']==225
          pairs=results('browser-pairs.log')[-1]
          songs=results('browser-songs.log')[-1]
          receipt=dict(parent='a73cafd2a7678bafe4bf84e8b4132af449546baa',workflowRun=os.environ['GITHUB_RUN_ID'],integration=integration,music=music,decode=decoded,browserPairs=pairs,browserSongs=songs,sourceManifest=source,patchSHA256='47f7504d4e89f2bab84ef4ba6b18cd9959aef4cdad57425816a37e1f11e7a8e2',nativeGModAccepted=False)
          text=json.dumps(receipt,indent=2)+'\n'
          Path('docs/validation/MS3_SONG_RECEIPT.json').write_text(text)
          (root/'MS3_SONG_RECEIPT.json').write_text(text)
          p=Path('docs/validation/MS3_SONG.md')
          p.write_text(p.read_text()+'\n## Final independent validation\n\nActions run '+os.environ['GITHUB_RUN_ID']+' passed '+str(integration['passed'])+'/'+str(integration['total'])+' integration suites with no source changes, '+str(music['passed'])+'/'+str(music['total'])+' music checks, '+str(music['lua_files'])+' Lua syntax files, all 225 real recording decodes, 240 real browser joins across 40 arrangements, and three complete browser song traversals plus wrap. Exact source fingerprints and all per-suite receipts are in MS3_SONG_RECEIPT.json. Only this result paragraph and the evidence receipt were added after the gates; no production code, score or audio changed. Native listening remains pending.\n')
          PY
          git config user.name 'Shael Riley'
          git config user.email 'shael.riley@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'MS3: validate song-first chronology and continuous full-performance audio' -m 'Complete immutable integration/music gates, real full-bank decoding and browser song traversal passed. Keep song-level continuity through ordinary floor/pressure changes; staging/boss/victory exceptions and Off remain. Source, recordings, tests and manual are coherent. Native listening and unavailable guide/GDD write remain explicit. Candidate branch only; no main, Workshop or VPS deployment.'
          git push origin HEAD:work/ms3-song-first
          git rev-parse HEAD > /tmp/ms3-song-validation/head.txt
          git rev-parse HEAD^{tree} > /tmp/ms3-song-validation/tree.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ms3-song-validation
          path: /tmp/ms3-song-validation
          retention-days: 7
