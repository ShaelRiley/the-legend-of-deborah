name: MS3 song-first workbench
on:
  push:
    branches: [work/ms3-song-first]
    paths: [.github/workflows/ms3-song-workbench.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p /tmp/ms3-song-source
          git rev-parse HEAD > /tmp/ms3-song-source/head.txt
          git archive --format=tar.gz HEAD > /tmp/ms3-song-source/source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: ms3-song-source
          path: /tmp/ms3-song-source
          compression-level: 0
          retention-days: 7
