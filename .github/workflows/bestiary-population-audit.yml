name: Bestiary population audit
on:
  push:
    branches: [fix/bestiary-population-audit]
    paths: [.github/workflows/bestiary-population-audit.yml]
permissions:
  contents: write
concurrency:
  group: bestiary-population-audit
  cancel-in-progress: true
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply and verify locally tested novelty correction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p=Path('gamemodes/legend_of_deborah/gamemode/lod/sv_encounter_ecology.lua')
          before=subprocess.check_output(['git','hash-object',str(p)],text=True).strip()
          assert before=='df20c2db1e5563afdfefefc62babf522740710ef',before
          s=p.read_text()
          old='                    weight = weight * (i == #e.before.recent and .2 or .6)'
          new='                    -- B26: more legal fights must not dilute adjacent-dungeon\n                    -- variety. Keep repeats possible when geometry limits choices.\n                    weight = weight * (i == #e.before.recent and .1 or .6)'
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          after=subprocess.check_output(['git','hash-object',str(p)],text=True).strip()
          assert after=='6613ebe7e68dc1a5a601a7012f606e416888eb2d',after
          print('B26_SOURCE_VERIFIED',after)
          PY
          git diff --check
      - name: Install Lua
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y liblua5.4-0
      - name: Verify production population regression
        run: python3 tools/run_lua54.py tools/test_bestiary_b26.lua | tee /tmp/b26-targeted.log
      - name: Preserve verified source object on audit branch
        run: |
          git add gamemodes/legend_of_deborah/gamemode/lod/sv_encounter_ecology.lua
          git -c user.name='LoD validation' -c user.email='validation@users.noreply.github.com' commit -m 'fix: preserve adjacent-dungeon novelty with denser encounters'
          git push origin HEAD:fix/bestiary-population-audit
          git rev-parse HEAD > /tmp/b26-prepared-head.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bestiary-b26-novelty-verified
          path: |
            /tmp/b26-prepared-head.txt
            /tmp/b26-targeted.log
          retention-days: 7
