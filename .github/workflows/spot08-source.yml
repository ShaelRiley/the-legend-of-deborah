name: SPOT08 exact parent source
on:
  push:
    branches: ['checkpoint/spot08-35c43bc8']
    paths: ['.github/workflows/spot08-source.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 35c43bc8bac86e5ea108b9f96e9d5ab6a94bf542
          fetch-depth: 1
      - name: Export authenticated parent, without source modification
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 35c43bc8bac86e5ea108b9f96e9d5ab6a94bf542
          test "$(git rev-parse HEAD^{tree})" = 7701bd9cf27ed7c6488e0ea9554e76bb9fb7a07f
          mkdir -p ../spot08-parent
          git archive --format=tar HEAD | gzip -n > ../spot08-parent/source.tar.gz
          git cat-file commit HEAD > ../spot08-parent/commit.txt
          git ls-tree -r HEAD > ../spot08-parent/tree.txt
          git rev-parse HEAD > ../spot08-parent/head.txt
          sha256sum ../spot08-parent/source.tar.gz > ../spot08-parent/source.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: spot08-parent-${{ github.run_id }}
          path: ../spot08-parent/
          retention-days: 14
