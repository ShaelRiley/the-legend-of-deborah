name: B27 verified candidate assembly
on:
  push:
    branches: [fix/adventure-pacing-b27]
    paths: [.github/workflows/b27-assemble.yml]
permissions:
  contents: write
concurrency:
  group: b27-candidate-assembly
  cancel-in-progress: true
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua validation runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y liblua5.4-0
      - name: Reconstruct hash-verified source and complete candidate tree
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, pathlib, subprocess, zlib
          def git(*args):
              return subprocess.check_output(['git',*args],text=True).strip()
          parts=[pathlib.Path('.github/b27-changes.part%d.txt'%i) for i in range(1,6)]
          payload=''.join(p.read_text().strip() for p in parts)
          assert len(payload)==14164, len(payload)
          raw=zlib.decompress(base64.b64decode(payload,validate=True))
          assert hashlib.sha256(raw).hexdigest()=='ea3b62c04a90fee19a587adb8dfb24126e03022094b4c5c3c8d07d32f363e36c'
          updates=json.loads(raw)
          helpers=[str(p) for p in parts]+['.github/workflows/b27-assemble.yml']
          subprocess.run(['git','rm','--']+helpers,check=True)
          assert git('write-tree')=='3e9ee5127bd33a28b5090951ab38c697052e33cd','baseline tree changed'
          for name,record in updates.items():
              path=pathlib.Path(name)
              assert not path.is_absolute() and '..' not in path.parts
              assert path.parts[0] in ('gamemodes','tools','docs')
              if record['before']:
                  assert git('hash-object',name)==record['before'],name
                  lines=path.read_text().splitlines(True)
              else:
                  assert not path.exists(),name
                  lines=[]
              for first,last,text in reversed(record['edits']):
                  assert 0<=first<=last<=len(lines),(name,first,last)
                  lines[first:last]=[text]
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_text(''.join(lines))
          subprocess.run(['python3','tools/build_manual.py'],check=True)
          subprocess.run(['git','add','--']+list(updates)+['docs/manual/manual.html','gamemodes/legend_of_deborah/gamemode/lod/manual'],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          tree=git('write-tree')
          assert tree=='63c1e0a204c5ce793a5b6ae125791a746b05a6f1',tree
          print('B27_COMPLETE_TREE_VERIFIED',tree)
          pathlib.Path('/tmp/b27-tree.txt').write_text(tree+'\n')
          PY
      - name: Actual population and specialist dispatch regressions
        run: |
          python3 tools/run_lua54.py tools/test_bestiary_b27.lua | tee /tmp/b27-population.log
          python3 tools/run_lua54.py tools/test_bestiary_b3.lua | tee /tmp/b27-pursuit.log
          python3 tools/run_lua54.py tools/test_bestiary_b11.lua | tee /tmp/b27-perception.log
      - name: Preserve candidate on audit branch only
        run: |
          git -c user.name='LoD validation' -c user.email='validation@users.noreply.github.com' commit -m 'fix: varied autonomous patrols and inhabited adventure pacing (B27 candidate)'
          git push origin HEAD:fix/adventure-pacing-b27
          git rev-parse HEAD > /tmp/b27-candidate.txt
      - uses: actions/upload-artifact@v4
        with:
          name: b27-candidate-proof
          path: |
            /tmp/b27-tree.txt
            /tmp/b27-candidate.txt
            /tmp/b27-population.log
            /tmp/b27-pursuit.log
            /tmp/b27-perception.log
          retention-days: 7
