name: Feat rebalance recovery snapshot
on:
  push:
    branches: [work/feat-rebalance-recovery-20261002]
    paths: [.github/workflows/feat-rebalance-recovery.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b81e8b95c55df2c6f7f5eb8a4ef7292700aef68e
          persist-credentials: false
      - name: Archive the verified baseline without credentials or Git configuration
        run: |
          test "$(git rev-parse HEAD)" = b81e8b95c55df2c6f7f5eb8a4ef7292700aef68e
          git archive --format=tar.gz --output=lod-baseline.tar.gz HEAD
          git rev-parse HEAD > lod-baseline-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: feat-rebalance-baseline
          path: |
            lod-baseline.tar.gz
            lod-baseline-sha.txt
          retention-days: 1
          if-no-files-found: error
