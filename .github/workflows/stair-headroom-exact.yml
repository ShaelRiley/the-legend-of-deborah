name: Standing stair headroom exact-source verification
on:
  push:
    branches: ['automation/stair-headroom-aebd2bb0']
    paths: ['.github/workflows/stair-headroom-exact.yml']
permissions:
  contents: write
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aebd2bb0083bb0b13b043486665342dfc1c084f0
          fetch-depth: 1
          path: candidate
      - name: Install existing finite-gate dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y liblua5.4-0 libzstd1
          python3 -m venv "$RUNNER_TEMP/stair-venv"
          "$RUNNER_TEMP/stair-venv/bin/python" -m pip install Pillow
          echo "$RUNNER_TEMP/stair-venv/bin" >> "$GITHUB_PATH"
          mkdir -p "$RUNNER_TEMP/stair-evidence"
          echo "EVIDENCE=$RUNNER_TEMP/stair-evidence" >> "$GITHUB_ENV"
      - name: Apply only the reviewed exact-source patch
        working-directory: candidate
        shell: bash
        env:
          PATCH_GZIP_BASE64: ''
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,gzip,hashlib,os,pathlib,subprocess
          patch=gzip.decompress(base64.b64decode(os.environ['PATCH_GZIP_BASE64'],validate=True))
          assert hashlib.sha256(patch).hexdigest()=='0a50a4167b8a9baac2d228bfb32260b81d8113721743e172e62a99ccf80798f3'
          path=pathlib.Path(os.environ['EVIDENCE'])/'repair.patch'
          path.write_bytes(patch)
          subprocess.run(['git','apply','--check','--index',str(path)],check=True)
          subprocess.run(['git','apply','--index',str(path)],check=True)
          PY
          git diff --cached --check
          test "$(git write-tree)" = 6147bb3efc373ba0255df90aa02fe5182671afdd
      - name: Independent 99-suite frozen-source gate
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/test_stair_headroom_gate.py --output "$EVIDENCE/independent" --suite-timeout 120 --workers 2 2>&1 | tee "$EVIDENCE/independent.log"
      - name: Publish only the exact validated non-forced child
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib
          r=json.loads((pathlib.Path(os.environ['EVIDENCE'])/'independent/receipt.json').read_text())
          assert r['passed']==r['total']==99 and r['lua_files']==757
          assert not r['changed_during_gate']
          assert r['source_before']==r['source_after']=='7aaa39e242a9ffdd3e8ea9a0e070c8bdc0463bf3e0f59c77fe9124a2acfbd8fd'
          PY
          test "$(git write-tree)" = 6147bb3efc373ba0255df90aa02fe5182671afdd
          git diff --exit-code
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = aebd2bb0083bb0b13b043486665342dfc1c084f0
          git -c user.name=OpenAI -c user.email=noreply@openai.com commit -m "Fix standing stair headroom while preserving the upper crossover"
          test "$(git rev-parse HEAD^)" = aebd2bb0083bb0b13b043486665342dfc1c084f0
          git push origin HEAD:refs/heads/main
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)"
          git archive --format=tar.gz HEAD > "$EVIDENCE/published-source.tar.gz"
          git ls-tree -r HEAD > "$EVIDENCE/published-tree.txt"
          git cat-file commit HEAD > "$EVIDENCE/published-commit.txt"
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          r={'commit':git('rev-parse','HEAD'),'parent':git('rev-parse','HEAD^'),'tree':git('rev-parse','HEAD^{tree}'),'selected_passed':99,'lua_syntax_files':757,'native_accepted':False,'workshop_deployed':False,'vps_deployed':False}
          (pathlib.Path(os.environ['EVIDENCE'])/'publication.json').write_text(json.dumps(r,indent=2)+'\n')
          print(json.dumps(r,indent=2))
          PY
      - name: Preserve results, including failed attempts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stair-headroom-exact-source-evidence
          path: ${{ runner.temp }}/stair-evidence/
          if-no-files-found: error
