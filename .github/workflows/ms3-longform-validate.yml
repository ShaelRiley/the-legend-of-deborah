name: MS3 long-form final validation
on:
  push:
    branches: [work/ms3-longform-integration]
    paths: [.github/workflows/ms3-longform-validate.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg liblua5.4-0
      - run: python -m pip install Pillow==12.3.0 numpy playwright
      - name: Apply exact reviewed source deltas and remove transport scaffolding
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,gzip,hashlib,json
          sha=lambda data:hashlib.sha256(data).hexdigest()
          encoded=''.join(p.read_text().strip() for p in sorted(Path('.github').glob('ms3-final-edits.*.b64')))
          # Correct one known transcription error in the temporary transfer only;
          # the complete decoded payload and every source file must still match.
          encoded=encoded.replace('V/uLX80//6zv8+Ld//Fiz','V/uLX80//6z8+Ld//Fiz')
          raw=gzip.decompress(base64.b64decode(encoded))
          assert sha(raw)=='283d214e1e7673acea0e2b0fec98b925f785778fc97f7c04b5e8933592476b27'
          for item in json.loads(raw):
              path=Path(item['path'])
              assert not path.is_absolute() and '..' not in path.parts and path.parts[0] in ('tools','docs','gamemodes')
              old=path.read_text() if path.exists() else ''
              assert (sha(old.encode()) if path.exists() else None)==item['base'], str(path)
              lines=old.splitlines(keepends=True)
              for start,end,text in reversed(item['edits']):lines[start:end]=text.splitlines(keepends=True)
              updated=''.join(lines)
              assert sha(updated.encode())==item['target'], str(path)
              path.parent.mkdir(parents=True,exist_ok=True);path.write_text(updated)
          engine=Path('tools/music/ms2_engine.js').read_text()
          Path('gamemodes/legend_of_deborah/gamemode/lod/ms2/engine.lua').write_text('return [==['+engine+']==]\n')
          for pattern in ('ms3-source.*.b64','ms3-final-edits.*.b64'):
              for path in Path('.github').glob(pattern):path.unlink()
          for name in ('ms3-longform-workbench.yml','ms3-longform-render.yml','ms3-longform-validate.yml'):
              Path('.github/workflows',name).unlink()
          PY
          git add -A
          git diff --cached --check
          mkdir -p /tmp/ms3-final
      - name: Complete immutable game integration matrix
        run: python tools/test_checkpoint_g_integration.py --workers 4 --output /tmp/ms3-final/integration | tee /tmp/ms3-final/integration.log
      - name: Complete music gate
        run: python tools/test_music_gate.py --output /tmp/ms3-final/music | tee /tmp/ms3-final/music.log
      - name: Actual complete-bank decode
        run: node tools/test_music_audio.js | tee /tmp/ms3-final/decode.log
      - name: Actual browser long-form audio
        run: |
          CHROME=$(command -v google-chrome || command -v chromium || true)
          if test -z "$CHROME"; then
            python -m playwright install --with-deps chromium
            CHROME=$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')
          fi
          MS3_CHROMIUM="$CHROME" python tools/test_ms3_audio.py --bank | tee /tmp/ms3-final/browser.log
      - name: Commit verified candidate and evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,subprocess
          root=Path('/tmp/ms3-final');matrix=json.loads((root/'integration/receipt.json').read_text())
          assert matrix['passed']==matrix['total']==299 and not matrix['changed_during_gate']
          assert 'MUSIC_GATE 45/45' in (root/'music.log').read_text()
          decode=[json.loads(s) for s in (root/'decode.log').read_text().splitlines() if s.startswith('{')][-1]
          browser=[json.loads(s) for s in (root/'browser.log').read_text().splitlines() if s.startswith('{')]
          assert decode['actualDecodes']==166 and browser[-1]['joins']==240 and browser[-1]['arrangements']==40
          receipt={'repairParent':'208a1af11c4448a054cc24e81603ed3446c0c55f','renderCandidate':'ea104e8fcb59fe0e24f4bfa244edf436b265e462','catalogRevision':'ms3-s16-e5961c1e5e7bf8cd','bankRevision':'ms2-surge-1d9386ddd67218a5','integration':matrix,'musicPassed':45,'musicTotal':45,'decode':decode,'browser':browser,'nativeGmodAccepted':False,'guideVerified':False,'liveGddWrite':'FAILED_PRECONDITION'}
          receipt['validatedSourceFiles']=json.loads((root/'integration/source_manifest.json').read_text())
          Path('docs/validation/MS3_LONGFORM_RECEIPT.json').write_text(json.dumps(receipt,indent=2)+'\n')
          p=Path('docs/validation/MS3_LONGFORM.md')
          p.write_text(p.read_text()+'\n## Final independent checkpoint result\n\nGitHub Actions completed **299/299 integration suites with zero source changes during the gate**, **45/45 music checks**, **166 actual recording decodes**, and **240 real browser loop/successor joins across 40 arrangements**. `MS3_LONGFORM_RECEIPT.json` contains the exact validated source fingerprints and complete per-suite receipts. Only this evidence receipt and this result paragraph were added after the immutable gates; no production code, score or recording changed afterward. Native listening remains pending.\n')
          PY
          git config user.name 'Shael Riley'
          git config user.email 'shael.riley@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'MS3: validate sixteen-bar score, bounded audio transport and source lineage' -m '299/299 immutable integration suites, 45/45 music checks, 166 actual decodes and 240 real browser joins. Includes all source/tests/docs, source-derived exit fills, one-pass composition and compact-tail PCM. Native listening and video-specific guide review remain open; GDD write rejected and amendment preserved. Candidate only; main promotion is separate.'
          git push origin HEAD:work/ms3-longform-integration
          git rev-parse HEAD > /tmp/ms3-final/candidate-head.txt
          git rev-parse HEAD^{tree} > /tmp/ms3-final/candidate-tree.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ms3-final-validation
          path: /tmp/ms3-final
          retention-days: 7
