name: MS3 song-first continuous render
on:
  push:
    branches: [work/ms3-song-first]
    paths: [.github/workflows/ms3-song-render.yml]
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: python -m pip install numpy scipy cmake
      - uses: actions/cache@v4
        id: surge
        with:
          path: |
            /tmp/lod-surge-source
            /tmp/lod-surge-build
          key: lod-surge-f7b97c6-accb4349-python312-ubuntu24-v1
      - name: Pinned offline Surge
        if: steps.surge.outputs.cache-hit != 'true'
        run: python tools/music/surge/prepare.py --source /tmp/lod-surge-source --build /tmp/lod-surge-build --jobs 4
      - name: Apply verified authoring patch
        run: |
          python - <<'PY'
          import base64,gzip,hashlib,subprocess
          from pathlib import Path
          data=gzip.decompress(base64.b64decode(Path('.github/ms3-song-render.b64').read_text()))
          assert hashlib.sha256(data).hexdigest()=='004842735a4602036da257b6827bdae1fe853fb9739d4d623cb96b4d1ac2471f'
          subprocess.run(['git','apply','--check','-'],input=data,check=True)
          subprocess.run(['git','apply','-'],input=data,check=True)
          PY
          python tools/test_ms3_song_score.py
      - name: Build complete ordered scores
        run: python tools/music/song_score.py --output build/ms3-song --stage-for-render
      - name: Render full performances and encode memory chunks
        run: python tools/music/build_ms2_surge.py --surge-module /tmp/lod-surge-build/src/surge-python --jobs 4 --work /tmp/ms3-song-render
      - name: Preserve rendered candidate on isolated branch
        run: |
          git config user.name 'Shael Riley'
          git config user.email 'shael.riley@gmail.com'
          git add tools/music/build_ms2_surge.py tools/music/song_score.py tools/music/surge/lock.json tools/test_ms3_song_score.py
          git add gamemodes/legend_of_deborah/gamemode/lod/ms2 gamemodes/legend_of_deborah/content/sound/lod/ms2_surge
          git add docs/MS2_CATALOG.json docs/MS3_SONG_AUDIT.json docs/MS3_SONG_SCORE.json docs/MS2_SURGE_BANK.json docs/validation/MS2_SURGE_AUDITION.json
          git add -f docs/MS2_CLIPS.zip docs/validation/MS2_SURGE_AUDITION.ogg
          git commit -m 'MS3 candidate: source-ordered full songs and continuous-performance audio' -m 'Authoring and render/decode passed. Runtime integration and full regression gates remain pending. Candidate branch only; no main/Workshop/VPS deployment.'
          git push origin HEAD:work/ms3-song-first
      - name: Export render result
        if: always()
        run: |
          mkdir -p /tmp/ms3-song-result
          git rev-parse HEAD > /tmp/ms3-song-result/head.txt
          git archive --format=tar.gz HEAD > /tmp/ms3-song-result/candidate.tar.gz
          cp docs/MS2_SURGE_BANK.json /tmp/ms3-song-result/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ms3-song-rendered
          path: /tmp/ms3-song-result
          compression-level: 0
          retention-days: 7
