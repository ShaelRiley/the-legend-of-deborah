name: MS3 candidate gate
on:
  push:
    branches: [work/ms3-continuous-score]
permissions:
  contents: write
concurrency:
  group: ms3-continuous-score-candidate
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble hash-verified candidate without modifying main
        shell: bash
        run: |
          mkdir -p /tmp/ms3-evidence
          python3 - <<'PY'
          import base64,bz2,hashlib,json
          from pathlib import Path
          text=''.join(Path('.ms3-candidate/payload.'+str(i)).read_text() for i in range(3))
          raw=bz2.decompress(base64.b64decode(text,validate=True))
          assert hashlib.sha256(raw).hexdigest()=='eb22093a32414fecc81f2bfb9c6126ef0dd226c483f92813227322047ee7848d'
          data=json.loads(raw)
          for name,content in data['files'].items():
              p=Path(name)
              assert not p.is_absolute() and '..' not in p.parts
              assert p.parts[0] in ('tools','docs','gamemodes')
              p.parent.mkdir(parents=True,exist_ok=True);p.write_text(content)
          Path('/tmp/ms3-apply.py').write_text(data['apply'])
          PY
          python3 /tmp/ms3-apply.py | tee /tmp/ms3-evidence/assemble.log
          git diff --check
      - name: Install finite validation dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y liblua5.4-0 ffmpeg
          python3 -m pip install Pillow==12.3.0 numpy playwright
          python3 -m playwright install --with-deps chromium
          echo "MS3_CHROMIUM=$(python3 -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" >> "$GITHUB_ENV"
      - name: Sample-clock scheduling and resource regressions
        run: node tools/test_ms3_transport.js | tee /tmp/ms3-evidence/transport.log
      - name: Actual browser-rendered bank joins
        run: python3 tools/test_ms3_audio.py --bank | tee /tmp/ms3-evidence/browser-audio.log
      - name: Music and affected lifecycle gate
        run: python3 tools/test_music_gate.py --output /tmp/ms3-gate | tee /tmp/ms3-evidence/music-gate.log
      - name: Decode every shipped recording
        run: node tools/test_music_audio.js | tee /tmp/ms3-evidence/decoded-bank.log
      - name: Full integration and syntax gate
        run: python3 tools/test_checkpoint_g_integration.py | tee /tmp/ms3-evidence/integration.log
      - name: Record tested tree and publish only to the isolated candidate branch
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          paths=['tools/music/ms2_engine.js','gamemodes/legend_of_deborah/gamemode/lod/ms2/engine.lua','gamemodes/legend_of_deborah/gamemode/lod/cl_music.lua','tools/test_ms3_transport.js','tools/test_ms3_audio.py','tools/test_ms2_catalog.py','tools/test_music_sequence.js','tools/test_music_gate.py','docs/DEVELOPMENT_PLAN.md','docs/validation/MS3_SAMPLE_CLOCK.md','docs/validation/MS3_GDD_AMENDMENT.md']
          receipt={'base':'90510057c608f8e2beec9debc6ceec36b35d14f3','runId':os.environ['GITHUB_RUN_ID'],'candidateTrigger':os.environ['GITHUB_SHA'],'nativeListeningAccepted':False,'liveGDDApplied':False,'passed':['ms3_transport','ms3_browser_audio_bank','music_gate','all_recording_decodes','checkpoint_g_integration'],'sha256':{p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths}}
          Path('docs/validation/MS3_CI_RECEIPT.json').write_text(json.dumps(receipt,indent=2)+'\n')
          Path('/tmp/ms3-paths').write_text('\n'.join(paths+['docs/validation/MS3_CI_RECEIPT.json'])+'\n')
          PY
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          xargs -d '\n' git add -- < /tmp/ms3-paths
          git rm .github/workflows/ms3-candidate.yml .ms3-candidate/payload.0 .ms3-candidate/payload.1 .ms3-candidate/payload.2
          git diff --cached --check
          git commit -m 'MS3: validated sample-clock rendered phrase continuity'
          git push origin HEAD:"$GITHUB_REF_NAME"
          git rev-parse HEAD | tee /tmp/ms3-evidence/validated-commit.txt
      - name: Preserve finite validation evidence
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/ms3-evidence
          git diff --binary > /tmp/ms3-evidence/candidate.patch
          git status --short > /tmp/ms3-evidence/status.txt
          test ! -d /tmp/ms3-gate || cp -r /tmp/ms3-gate /tmp/ms3-evidence/music-gate
          for path in gamemodes/legend_of_deborah/gamemode/lod/cl_music.lua docs/validation/MS3_CI_RECEIPT.json; do
            test ! -f "$path" || cp "$path" /tmp/ms3-evidence/
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ms3-candidate-evidence
          path: /tmp/ms3-evidence
          retention-days: 7
