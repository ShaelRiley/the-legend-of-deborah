name: MS3 long-form build
on:
  push:
    branches: [work/ms3-sixteen-bar-source]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update -qq && sudo apt-get install -y liblua5.4-0 ffmpeg libpython3.12-dev
      - run: python -m pip install numpy scipy cmake Pillow==12.3.0 playwright
      - run: python -m playwright install --with-deps chromium
      - uses: actions/cache@v4
        with:
          path: |
            /tmp/lod-surge-source
            /tmp/lod-surge-build
          key: lod-surge-ubuntu24-py312-f7b97c6-offline1
      - name: Apply exact locally tested readable source changes
        run: |
          python - <<'PY'
          import hashlib,lzma,subprocess
          from pathlib import Path
          parts=sorted(Path('.github/ms3-transfer').glob('*.part'))
          if parts:
              packed=b''.join(p.read_bytes() for p in parts)
              assert hashlib.sha256(packed).hexdigest()=='45b15980cc3e710bec9b5c8ab14b589b58f3785f17c9688a297f8e052062623a'
              patch=lzma.decompress(packed)
              subprocess.run(['git','apply','--check','--unidiff-zero'],input=patch,check=True)
              subprocess.run(['git','apply','--unidiff-zero'],input=patch,check=True)
              subprocess.run(['git','rm','-r','.github/ms3-transfer'],check=True)
          PY
          python tools/music/build_ms2_audio.py
          python tools/music/install_ms3_score.py
          node tools/test_ms3_longform.js
          node tools/test_ms3_transport.js
          python tools/test_ms3_sixteen_bar.py
      - name: Render complete pinned Surge bank unless already current
        run: |
          if ! python tools/test_ms2_surge_bank.py; then
            python tools/music/surge/prepare.py --source /tmp/lod-surge-source --build /tmp/lod-surge-build --jobs 4
            python tools/music/build_ms2_surge.py --surge-module /tmp/lod-surge-build/src/surge-python --jobs 4
            python tools/test_ms2_surge_bank.py
          fi
      - name: Preserve complete rendered candidate on isolated branch
        run: |
          git config user.name 'Shael Riley'
          git config user.email 'shael.riley@gmail.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'MS3: integrate sixteen-bar source passages and bounded long-buffer playback candidate'
            git push origin HEAD:work/ms3-sixteen-bar-source
          fi
      - name: Complete music, decode, real audio and game integration gates
        run: |
          mkdir -p build/ms3-longform-evidence
          python - <<'PY'
          import json,os,subprocess,hashlib,time
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p: os.environ['MS3_CHROMIUM']=p.chromium.executable_path
          dest=Path('build/ms3-longform-evidence')
          commands={
              'music':['python','tools/test_music_gate.py','--output',str(dest/'music')],
              'actual-decode':['node','tools/test_music_audio.js'],
              'actual-browser-audio':['python','tools/test_ms3_audio.py','--bank'],
              'integration':['python','tools/test_checkpoint_g_integration.py','--workers','4','--output',str(dest/'integration')],
          }
          rows=[]
          for name,cmd in commands.items():
              start=time.monotonic()
              with (dest/(name+'.log')).open('w') as out:
                  result=subprocess.run(cmd,stdout=out,stderr=subprocess.STDOUT)
              row={'gate':name,'returncode':result.returncode,'seconds':round(time.monotonic()-start,3)}
              rows.append(row);print(json.dumps(row),flush=True)
              if result.returncode: print((dest/(name+'.log')).read_text()[-10000:],flush=True)
          paths=subprocess.check_output(['git','ls-files','tools','gamemodes','lua'],text=True).splitlines()
          source={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths if Path(p).is_file()}
          report={'candidate':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'gates':rows,'sourceSHA256':hashlib.sha256(json.dumps(source,sort_keys=True).encode()).hexdigest(),'nativeAccepted':False,'workshopPublished':False,'vpsDeployed':False}
          (dest/'results.json').write_text(json.dumps(report,indent=2)+'\n')
          if any(r['returncode'] for r in rows): raise SystemExit(1)
          Path('docs/validation/MS3_LONGFORM_RESULTS.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
      - name: Preserve passing receipts
        run: |
          git add docs/validation/MS3_LONGFORM_RESULTS.json
          git commit -m 'MS3: record completed long-form source, PCM and integration gates'
          git push origin HEAD:work/ms3-sixteen-bar-source
      - name: Archive current source and evidence
        if: always()
        run: |
          mkdir -p build/ms3-longform-evidence
          git rev-parse HEAD > build/ms3-longform-evidence/head.txt
          git archive --format=tar.gz HEAD > build/ms3-longform-evidence/repository.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ms3-longform-evidence
          path: build/ms3-longform-evidence
          retention-days: 7
