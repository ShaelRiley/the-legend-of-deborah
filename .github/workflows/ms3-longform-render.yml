name: MS3 long-form candidate render
on:
  push:
    branches: [work/ms3-longform-integration]
    paths: [.github/workflows/ms3-longform-render.yml]
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy cmake
      - uses: actions/cache@v4
        id: surge
        with:
          path: |
            /tmp/lod-surge-source
            /tmp/lod-surge-build
          key: lod-surge-f7b97c6-accb4349-python312-ubuntu24-v1
      - name: Restore pinned offline tool
        if: steps.surge.outputs.cache-hit != 'true'
        run: python tools/music/surge/prepare.py --source /tmp/lod-surge-source --build /tmp/lod-surge-build --jobs 4
      - name: Apply exact reviewed integration source
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,gzip,hashlib,subprocess
          data=gzip.decompress(base64.b64decode(''.join(p.read_text().strip() for p in sorted(Path('.github').glob('ms3-source.*.b64')))))
          assert hashlib.sha256(data).hexdigest()=='6ee17fb582526a39adc2b733c9a7345c3dd0db9e39f54e608d28702faa51badf'
          subprocess.run(['git','apply','--check','-'],input=data,check=True)
          subprocess.run(['git','apply','-'],input=data,check=True)
          engine=Path('tools/music/ms2_engine.js').read_text()
          Path('gamemodes/legend_of_deborah/gamemode/lod/ms2/engine.lua').write_text('return [==['+engine+']==]\n')
          PY
          python -m py_compile tools/music/*.py
          node --check tools/music/ms2_engine.js
      - name: Re-map complete original MIDI source
        run: python tools/music/remap_ms3_sixteen_bar.py --mapped-exits --stage-for-render --output build/ms3-longform
      - name: Render and decode every long-form recording
        run: python tools/music/build_ms2_surge.py --surge-module /tmp/lod-surge-build/src/surge-python --jobs 4 --work /tmp/ms3-render
      - name: Preserve rendered candidate only on isolated branch
        run: |
          git config user.name 'Shael Riley'
          git config user.email 'shael.riley@gmail.com'
          git add tools/music/build_ms2.py tools/music/remap_ms3_sixteen_bar.py tools/music/build_ms2_surge.py tools/music/ms2_engine.js
          git add gamemodes/legend_of_deborah/gamemode/lod/cl_music.lua gamemodes/legend_of_deborah/gamemode/lod/cl_music_native.lua gamemodes/legend_of_deborah/gamemode/lod/sh_music.lua gamemodes/legend_of_deborah/gamemode/lod/ms2
          git add gamemodes/legend_of_deborah/content/sound/lod/ms2_surge docs/MS2_CATALOG.json docs/MS3_16_BAR_AUDIT.json docs/MS2_SURGE_BANK.json docs/validation/MS2_SURGE_AUDITION.json
          git add -f docs/MS2_CLIPS.zip docs/validation/MS2_SURGE_AUDITION.ogg
          git commit -m 'MS3 candidate: genuine sixteen-bar source arrangements and compact audio transport' -m 'Offline rendering and per-recording decode complete. Candidate branch only: complete runtime integration gates and native listening acceptance remain pending. No main, Workshop or VPS deployment.'
          git push origin HEAD:work/ms3-longform-integration
      - name: Export exact candidate and render metrics
        if: always()
        run: |
          mkdir -p /tmp/ms3-result
          git rev-parse HEAD > /tmp/ms3-result/head.txt
          git diff --stat > /tmp/ms3-result/uncommitted.txt
          git archive --format=tar.gz HEAD > /tmp/ms3-result/candidate.tar.gz
          if test -f docs/MS2_SURGE_BANK.json; then cp docs/MS2_SURGE_BANK.json /tmp/ms3-result/; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ms3-rendered-candidate
          path: /tmp/ms3-result
          compression-level: 0
          retention-days: 7
