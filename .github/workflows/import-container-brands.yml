# V14 owns the minimal stock HL2/GMod cargo hull; V15 owns sparse/full-face overlays.
name: Build and validate container surface assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-container-brands.yml'
      - 'docs/CONTAINER_BRANDING.md'
      - 'tools/assets/build_container_stock_v14.py'
      - 'tools/assets/patch_container_stock_v14.py'
      - 'tools/assets/validate_container_v14.py'
      - 'tools/assets/patch_container_marking_density_v15.py'
      - 'tools/assets/patch_container_marking_direction_v15_1.py'
      - 'tools/assets/validate_container_marking_v15.py'
      - 'gamemodes/legend_of_deborah/content/materials/legend_of_deborah/container_sections/**'
      - 'gamemodes/legend_of_deborah/gamemode/lod/cl_container_branding.lua'
      - 'gamemodes/legend_of_deborah/gamemode/lod/cl_container_wayfinding_projection.lua'
      - 'gamemodes/legend_of_deborah/gamemode/lod/cl_container_marking_panel.lua'
      - 'gamemodes/legend_of_deborah/gamemode/lod/cl_container_section_recolor.lua'
      - 'gamemodes/legend_of_deborah/gamemode/lod/cl_wall_visuals.lua'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate container Python tooling syntax
        run: |
          python3 -m py_compile tools/assets/build_container_stock_v14.py
          python3 -m py_compile tools/assets/patch_container_stock_v14.py
          python3 -m py_compile tools/assets/validate_container_v14.py
          python3 -m py_compile tools/assets/patch_container_marking_density_v15.py
          python3 -m py_compile tools/assets/patch_container_marking_direction_v15_1.py
          python3 -m py_compile tools/assets/validate_container_marking_v15.py

      - name: Build V14 minimal stock section materials
        run: python3 tools/assets/build_container_stock_v14.py

      - name: Apply V14 minimal stock runtime wiring
        run: python3 tools/assets/patch_container_stock_v14.py

      - name: Apply V15 sparse full-face overlay rules
        run: python3 tools/assets/patch_container_marking_density_v15.py

      - name: Correct V15 full-face direction indexing
        run: python3 tools/assets/patch_container_marking_direction_v15_1.py

      - name: Normalize generated documentation EOF
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/CONTAINER_BRANDING.md')
          path.write_text(path.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY

      - name: Validate container presentation
        run: |
          python3 tools/assets/validate_container_v14.py
          python3 tools/assets/validate_container_marking_v15.py
          git diff --check

      - name: Commit generated container presentation wiring
        run: |
          git add -A \
            docs/CONTAINER_BRANDING.md \
            gamemodes/legend_of_deborah/content/materials/legend_of_deborah/container_sections \
            gamemodes/legend_of_deborah/gamemode/lod/cl_container_branding.lua \
            gamemodes/legend_of_deborah/gamemode/lod/cl_container_wayfinding_projection.lua \
            gamemodes/legend_of_deborah/gamemode/lod/cl_container_marking_panel.lua \
            gamemodes/legend_of_deborah/gamemode/lod/cl_container_section_recolor.lua \
            gamemodes/legend_of_deborah/gamemode/lod/cl_wall_visuals.lua
          if git diff --cached --quiet; then
            echo 'Container presentation already matches generated output.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Use sparse full-face-only container overlays'
          git push origin HEAD:${GITHUB_REF_NAME}
