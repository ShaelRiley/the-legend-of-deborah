name: Build and validate container surface assets

on:
  push:
    branches: [main, agent/container-alpha-v8, agent/container-blank-hull-v9, agent/container-submaterial-v10]
    paths:
      - '.github/workflows/import-container-brands.yml'
      - 'docs/CONTAINER_BRANDING.md'
      - 'tools/assets/build_container_surface_assets.py'
      - 'tools/assets/build_container_blank_hull_v9.py'
      - 'tools/assets/container_brand_names.tsv'
      - 'tools/assets/patch_container_grit_v6.py'
      - 'tools/assets/patch_container_alpha_v7.py'
      - 'tools/assets/patch_container_alpha_v8.py'
      - 'tools/assets/patch_container_blank_hull_v9.py'
      - 'tools/assets/patch_container_submaterials_v10.py'
      - 'tools/assets/validate_container_v6.py'
      - 'tools/assets/validate_container_v8.py'
      - 'tools/assets/validate_container_v9.py'
      - 'tools/assets/validate_container_v10.py'
      - 'gamemodes/legend_of_deborah/content/materials/legend_of_deborah/container_brands/**'
      - 'gamemodes/legend_of_deborah/content/materials/legend_of_deborah/container_surfaces/**'
      - 'gamemodes/legend_of_deborah/gamemode/lod/cl_container_branding.lua'
      - 'gamemodes/legend_of_deborah/gamemode/lod/cl_container_section_recolor.lua'
      - 'gamemodes/legend_of_deborah/gamemode/lod/cl_wall_visuals.lua'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install builder dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet Pillow numpy

      - name: Validate Python tooling syntax
        run: |
          python3 -m py_compile tools/assets/build_container_surface_assets.py
          python3 -m py_compile tools/assets/build_container_blank_hull_v9.py
          python3 -m py_compile tools/assets/patch_container_grit_v6.py
          python3 -m py_compile tools/assets/patch_container_alpha_v7.py
          python3 -m py_compile tools/assets/patch_container_alpha_v8.py
          python3 -m py_compile tools/assets/patch_container_blank_hull_v9.py
          python3 -m py_compile tools/assets/patch_container_submaterials_v10.py
          python3 -m py_compile tools/assets/validate_container_v6.py
          python3 -m py_compile tools/assets/validate_container_v8.py
          python3 -m py_compile tools/assets/validate_container_v9.py
          python3 -m py_compile tools/assets/validate_container_v10.py

      - name: Build V9 truly blank corrugated hull
        run: python3 tools/assets/build_container_blank_hull_v9.py

      - name: Apply V9 blank hull runtime binding
        run: python3 tools/assets/patch_container_blank_hull_v9.py

      - name: Apply V10 explicit cargo material slots
        run: python3 tools/assets/patch_container_submaterials_v10.py

      - name: Normalize generated documentation EOF
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/CONTAINER_BRANDING.md')
          path.write_text(path.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY

      - name: Validate V10 presentation
        run: |
          python3 tools/assets/validate_container_v10.py
          git diff --check

      - name: Commit generated runtime assets and V10 wiring
        run: |
          git add -A \
            docs/CONTAINER_BRANDING.md \
            gamemodes/legend_of_deborah/content/materials/legend_of_deborah/container_surfaces/container_blank_hull_v9.png \
            gamemodes/legend_of_deborah/gamemode/lod/cl_container_section_recolor.lua
          if git diff --cached --quiet; then
            echo 'V10 runtime already matches generated output.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Replace every cargo material slot with blank hull [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME}
