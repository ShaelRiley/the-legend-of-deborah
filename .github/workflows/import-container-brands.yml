# V13 uses only mounted stock HL2/GMod textures for the cargo hull.
name: Build and validate container surface assets

on:
  push:
    branches: [main, agent/container-stock-v13]
    paths:
      - '.github/workflows/import-container-brands.yml'
      - 'docs/CONTAINER_BRANDING.md'
      - 'tools/assets/build_container_stock_v13.py'
      - 'tools/assets/patch_container_stock_v13.py'
      - 'tools/assets/validate_container_v13.py'
      - 'gamemodes/legend_of_deborah/content/materials/legend_of_deborah/container_sections/**'
      - 'gamemodes/legend_of_deborah/gamemode/lod/cl_container_branding.lua'
      - 'gamemodes/legend_of_deborah/gamemode/lod/cl_container_section_recolor.lua'
      - 'gamemodes/legend_of_deborah/gamemode/lod/cl_wall_visuals.lua'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate V13 Python tooling syntax
        run: |
          python3 -m py_compile tools/assets/build_container_stock_v13.py
          python3 -m py_compile tools/assets/patch_container_stock_v13.py
          python3 -m py_compile tools/assets/validate_container_v13.py

      - name: Build V13 stock HL2 section materials
        run: python3 tools/assets/build_container_stock_v13.py

      - name: Apply V13 stock runtime wiring
        run: python3 tools/assets/patch_container_stock_v13.py

      - name: Validate V13 presentation
        run: |
          python3 tools/assets/validate_container_v13.py
          git diff --check

      - name: Commit generated V13 runtime wiring
        run: |
          git add -A \
            docs/CONTAINER_BRANDING.md \
            gamemodes/legend_of_deborah/content/materials/legend_of_deborah/container_sections \
            gamemodes/legend_of_deborah/gamemode/lod/cl_container_section_recolor.lua
          if git diff --cached --quiet; then
            echo 'V13 runtime already matches generated output.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Use stock HL2 metal for cargo hull [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME}
