name: SPOT-14 exact-source verification and publication
on:
  push:
    branches: [automation/spot14-time-management-publication]
permissions:
  contents: write
  actions: read
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE: 3b4df50fe001dd0dc7e2d7df9e3339a6bcceff13
      EXPECTED_TREE: 6e4cf9256a1f6d522d552486eedaa9ad4fa23bb4
      EXPECTED_SOURCE: 7b2332fa766904cec845303729263ff95844b2a0cba81c880279f55e12ce4f0d
      PAYLOAD_HASH: ee455d4463ff6e2325f3011561764f6daad995b3b5260448725cb46609da388c
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3b4df50fe001dd0dc7e2d7df9e3339a6bcceff13
          fetch-depth: 0
      - name: Prepare verification dependencies and compression reference
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/spot14-evidence"
          mkdir -p "$E"
          sudo apt-get update
          sudo apt-get install -y liblua5.4-0 zstd
          python3 -m pip install Pillow
          gh api repos/ShaelRiley/the-legend-of-deborah/actions/artifacts/10919966814/zip > "$E/reference.zip"
          echo "a0b929171ff001233bb35fe978fbbdd004ccce31047e1cb1185f0cef9a22cb1e  $E/reference.zip" | sha256sum --check
      - name: Restore and independently verify frozen source
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/spot14-evidence"
          exec > >(tee "$E/independent.log") 2>&1
          test "$(git rev-parse HEAD)" = "$BASE"
          test -z "$(git status --porcelain)"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          git fetch origin "$GITHUB_SHA"
          for i in 0 1 2 3 4 5 6; do
            git show "$GITHUB_SHA:.spot14/source.$i.xzpart"
          done > "$E/transport.xz"
          echo "$PAYLOAD_HASH  $E/transport.xz" | sha256sum --check
          python3 - "$E" <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess, sys, zipfile
          evidence = pathlib.Path(sys.argv[1])
          payload = json.loads(lzma.decompress((evidence/'transport.xz').read_bytes()))
          names = subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          reference = json.dumps({n:hashlib.sha256(pathlib.Path(n).read_bytes()).hexdigest()
                                  for n in sorted(names) if n and pathlib.Path(n).is_file()},
                                 sort_keys=True).encode()
          (evidence/'base-manifest.json').write_bytes(reference)
          # Historical verified logs are only a lossless compression dictionary,
          # never evidence of the new source passing its independent gate.
          with zipfile.ZipFile(evidence/'reference.zip') as archive:
              receipt_bytes = archive.read('gate/receipt.json')
              prior = json.loads(receipt_bytes)
              assert prior['passed'] == prior['total'] == 85
              reference += receipt_bytes
              for row in prior['results']:
                  log = archive.read('gate/'+row['log'])
                  assert hashlib.sha256(log).hexdigest() == row['log_sha256']
                  reference += log
          reference_hash = hashlib.sha256(reference).hexdigest()
          assert reference_hash == payload['reference_sha256']
          (evidence/'reference-dictionary.bin').write_bytes(reference)
          (evidence/'compression-reference.json').write_text(json.dumps({
              'artifact_id':10919966814, 'artifact_sha256':
              'a0b929171ff001233bb35fe978fbbdd004ccce31047e1cb1185f0cef9a22cb1e',
              'dictionary_sha256':reference_hash, 'old_logs_are_new_evidence':False
          }, indent=2)+'\n')
          patch = evidence/'source.patch'
          patch.write_text(payload['patch'], encoding='utf-8')
          subprocess.run(['git','apply','--check',str(patch)], check=True)
          subprocess.run(['git','apply',str(patch)], check=True)
          delta, raw = evidence/'archive.delta.zst', evidence/'archive.raw.tar'
          delta.write_bytes(base64.b64decode(payload['archive_delta'], validate=True))
          subprocess.run(['zstd','-d','--patch-from='+str(evidence/'reference-dictionary.bin'),
                          str(delta),'-o',str(raw),'-f'], check=True)
          exact = lzma.compress(raw.read_bytes())
          assert hashlib.sha256(exact).hexdigest() == payload['archive_sha256']
          pathlib.Path('docs/validation/SPOT_14_ATTEMPTS.tar.xz').write_bytes(exact)
          print('EXACT_RETAINED_ATTEMPTS', payload['archive_sha256'])
          raw.unlink()
          (evidence/'reference.zip').unlink()
          PY
          python3 tools/run_lua54.py tools/export_manual_catalog.lua
          python3 tools/build_manual.py
          git add -A
          test "$(git write-tree)" = "$EXPECTED_TREE"
          test "$(git ls-files | wc -l)" -eq 2189
          git diff --cached --check
          python3 tools/test_spot14_gate.py --output "$E/gate" --suite-timeout 120 --workers 2
          python3 - "$E" <<'PY'
          import hashlib, json, os, pathlib, sys
          root = pathlib.Path(sys.argv[1])/'gate'
          r = json.loads((root/'receipt.json').read_text())
          assert r['passed'] == r['total'] == 87, r
          assert r['lua_files'] == 749
          assert r['suite_timeout_seconds'] == 120 and r['workers'] == 2
          assert r['source_before'] == r['source_after'] == os.environ['EXPECTED_SOURCE']
          assert r['changed_during_gate'] == [] and r['native_gmod_accepted'] is False
          for row in r['results']:
              assert hashlib.sha256((root/row['log']).read_bytes()).hexdigest() == row['log_sha256']
          print('EXACT_SOURCE_GATE_PASS 87/87; 749 Lua files; unchanged source; verified logs')
          PY
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git diff --exit-code
      - name: Publish one non-forced child of actual main
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/spot14-evidence"
          exec > >(tee "$E/publication.log") 2>&1
          test "$(git rev-parse HEAD)" = "$BASE"
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git diff --exit-code
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'SPOT-14: reversible Time Management dungeon allowance'
          test "$(git rev-parse HEAD^)" = "$BASE"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          git push origin HEAD:refs/heads/main
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)"
          git archive --format=tar.gz HEAD -o "$E/published-source.tar.gz"
          git ls-tree -r HEAD > "$E/published-tree.txt"
          git cat-file commit HEAD > "$E/published-commit.txt"
          git diff --binary "$BASE" HEAD > "$E/published-complete.patch"
          python3 - "$E" <<'PY'
          import json, os, pathlib, subprocess, sys
          def git(*args):
              return subprocess.check_output(['git',*args], text=True).strip()
          r = {'commit':git('rev-parse','HEAD'), 'parent':git('rev-parse','HEAD^'),
               'tree':git('rev-parse','HEAD^{tree}'), 'source':os.environ['EXPECTED_SOURCE'],
               'tracked':len(git('ls-files').splitlines()), 'run_id':os.environ['GITHUB_RUN_ID'],
               'attempt':os.environ['GITHUB_RUN_ATTEMPT'], 'selected_suites':87,
               'lua_syntax_files':749, 'new_focused_assertions':258,
               'suite_timeout_seconds':120, 'workers':2, 'native_accepted':False,
               'full_campaign_matrix':False, 'workshop_or_vps_actions':False, 'push_force':False,
               'trigger_commit_not_gameplay_parent':os.environ['GITHUB_SHA'],
               'transport_hash':os.environ['PAYLOAD_HASH']}
          assert r['parent'] == os.environ['BASE'] and r['tree'] == os.environ['EXPECTED_TREE']
          assert r['tracked'] == 2189
          (pathlib.Path(sys.argv[1])/'publication.json').write_text(json.dumps(r,indent=2)+'\n')
          print(json.dumps(r,indent=2))
          PY
      - name: Preserve exact source and independent evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spot14-exact-source-evidence
          path: ${{ runner.temp }}/spot14-evidence
          retention-days: 14
          if-no-files-found: error
