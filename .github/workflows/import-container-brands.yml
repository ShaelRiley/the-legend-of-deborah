# C1 replaces the historical V14/V19 patch-and-auto-push pipeline. CI verifies
# committed originals and production code; it must never reinstall old rendering.
name: Validate Great Crate assets and rendering
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-container-brands.yml'
      - 'tools/assets/**'
      - 'tools/test_great_crate*'
      - 'docs/CONTAINER_BRAND*'
      - 'gamemodes/legend_of_deborah/content/materials/legend_of_deborah/**'
      - 'gamemodes/legend_of_deborah/gamemode/lod/*crate*'
      - 'gamemodes/legend_of_deborah/gamemode/lod/*container*'
      - 'gamemodes/legend_of_deborah/gamemode/lod/cl_textured_box.lua'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y liblua5.4-0
      - run: python3 -m pip install Pillow
      - name: Original assets, deterministic geometry and bounded rendering
        run: |
          python3 tools/test_great_crate_assets.py
          python3 tools/run_lua54.py tools/test_great_crate_geometry.lua
          python3 tools/run_lua54.py tools/test_great_crate_render.lua
          git diff --exit-code
