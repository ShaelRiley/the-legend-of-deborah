name: Build and validate container surface assets

on:
  push:
    branches:
      - main
      - agent/container-surface-v3
    paths:
      - '.github/workflows/import-container-brands.yml'
      - 'docs/CONTAINER_BRANDING.md'
      - 'tools/assets/build_container_surface_assets.py'
      - 'tools/assets/container_brand_names.tsv'
      - 'gamemodes/legend_of_deborah/content/materials/legend_of_deborah/container_brands/**'
      - 'gamemodes/legend_of_deborah/content/materials/legend_of_deborah/container_surfaces/**'
      - 'gamemodes/legend_of_deborah/gamemode/lod/cl_container_branding.lua'
      - 'gamemodes/legend_of_deborah/gamemode/lod/cl_container_section_recolor.lua'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out triggering ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install asset builder dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet Pillow numpy srctools

      - name: Fetch pinned stock cargo UV sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/lod-container-stock
          base='https://raw.githubusercontent.com/bouletmarc/hl2_ep2_content/472d4cb9ac7a32a8a408ac8cfeff6d978e70a75f/materials/models/props_wasteland'
          for name in cargo_container01 cargo_container01c cargo_container02 cargo_container03; do
            curl --fail --location --retry 3 --silent --show-error \
              "$base/$name.vtf" \
              --output "/tmp/lod-container-stock/$name.vtf"
            bytes=$(wc -c < "/tmp/lod-container-stock/$name.vtf")
            if [ "$bytes" -lt 500000 ]; then
              echo "$name.vtf is unexpectedly small: $bytes bytes" >&2
              exit 1
            fi
            python3 - "/tmp/lod-container-stock/$name.vtf" <<'PY'
          import struct, sys
          path = sys.argv[1]
          raw = open(path, 'rb').read(24)
          if raw[:4] != b'VTF\0':
              raise SystemExit(f'{path}: invalid VTF signature')
          width, height = struct.unpack_from('<HH', raw, 16)
          if (width, height) != (1024, 1024):
              raise SystemExit(f'{path}: expected 1024x1024 stock UV texture, got {width}x{height}')
          print(f'{path}: {width}x{height}')
          PY
          done

      - name: Build stock-UV blank and readable high-resolution spray assets
        run: |
          python3 tools/assets/build_container_surface_assets.py \
            --stock-vtf /tmp/lod-container-stock/cargo_container01.vtf \
            --stock-vtf /tmp/lod-container-stock/cargo_container01c.vtf \
            --stock-vtf /tmp/lod-container-stock/cargo_container02.vtf \
            --stock-vtf /tmp/lod-container-stock/cargo_container03.vtf \
            --patch-runtime

      - name: Validate generated surface pipeline
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          surface_dir = Path(
              'gamemodes/legend_of_deborah/content/materials/'
              'legend_of_deborah/container_surfaces'
          )
          blank = surface_dir / 'container_blank_metal.png'
          if not blank.exists():
              raise SystemExit('stock-UV blank texture missing')
          blank_image = Image.open(blank)
          if blank_image.size != (1024, 1024):
              raise SystemExit(f'blank cargo dimensions={blank_image.size}')
          print(f'blank cargo: 1024x1024 {blank.stat().st_size} bytes')

          expected = [
              surface_dir / f'container_brand_spray_atlas_{index:02d}.png'
              for index in range(1, 5)
          ]
          actual = sorted(surface_dir.glob('container_brand_spray_atlas_*.png'))
          if actual != expected:
              raise SystemExit(f'spray atlas set mismatch: {actual}')
          for path in expected:
              image = Image.open(path).convert('RGBA')
              if image.size != (2048, 1024):
                  raise SystemExit(f'{path.name}: dimensions={image.size}')
              lo, hi = image.getchannel('A').getextrema()
              if lo != 0 or hi < 192:
                  raise SystemExit(f'{path.name}: alpha={lo}..{hi}')
              if path.stat().st_size < 50000:
                  raise SystemExit(f'{path.name}: suspiciously small ({path.stat().st_size} bytes)')
              print(f'{path.name}: {path.stat().st_size} bytes alpha={lo}..{hi}')

          names_path = Path('tools/assets/container_brand_names.tsv')
          rows = [line.split('\t', 2) for line in names_path.read_text(encoding='utf-8').splitlines() if line.strip()]
          ids = [int(row[0]) for row in rows]
          if ids != list(range(1, 257)):
              raise SystemExit('container brand-name manifest must contain canonical IDs 001..256')
          if rows[-1][1] != 'Deborah Logistics Unlimited':
              raise SystemExit('brand 256 must remain Deborah Logistics Unlimited')

          recolor_path = Path(
              'gamemodes/legend_of_deborah/gamemode/lod/cl_container_section_recolor.lua'
          )
          recolor = recolor_path.read_text(encoding='utf-8')
          recolor_required = [
              'CONTAINER_BLANK_BASE_PATH',
              'container_surfaces/container_blank_metal.png',
              'blankBaseMaterial:GetTexture("$basetexture")',
              'v9_stock_uv_blank',
          ]
          missing = [token for token in recolor_required if token not in recolor]
          if missing:
              raise SystemExit(f'recolor missing stock-UV blank wiring: {missing}')
          if 'v8_blank_metal_surface' in recolor:
              raise SystemExit('generic v8 blank-metal material is still live')

          renderer_path = Path(
              'gamemodes/legend_of_deborah/gamemode/lod/cl_container_branding.lua'
          )
          renderer = renderer_path.read_text(encoding='utf-8')
          renderer_required = [
              'local BRAND_COUNT = 256',
              'LOD.Seeds.Derive(seed, "container-brand:v1")',
              'container_brand_spray_atlas_',
              'CreateMaterial(name, "VertexLitGeneric"',
              'Material(path, "vertexlitgeneric smooth nocull")',
              'render.DrawQuad(',
              'instance and not instance.marked',
              'spanY * 0.62',
              'mode=vertexlit-spray-v3-hires',
          ]
          missing = [token for token in renderer_required if token not in renderer]
          if missing:
              raise SystemExit(f'brand renderer missing V3 wiring: {missing}')
          forbidden = [
              'PATCH_WIDTH',
              'PATCH_HEIGHT',
              'surface.DrawTexturedRectUV(',
              'mode=vertexlit-spray-v2',
          ]
          present = [token for token in forbidden if token in renderer]
          if present:
              raise SystemExit(f'legacy brand presentation still live: {present}')

          print('Stock-UV blank + readable high-resolution spray validation passed.')
          PY

      - name: Check whitespace
        run: git diff --check

      - name: Commit generated runtime assets
        shell: bash
        run: |
          git add \
            gamemodes/legend_of_deborah/content/materials/legend_of_deborah/container_surfaces \
            gamemodes/legend_of_deborah/gamemode/lod/cl_container_section_recolor.lua
          if git diff --cached --quiet; then
            echo 'Generated container surface assets already match the repository.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Build stock-UV high-resolution container assets [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME}
