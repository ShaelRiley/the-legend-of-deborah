name: Validate container brand runtime assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-container-brands.yml'
      - 'docs/CONTAINER_BRANDING.md'
      - 'tools/assets/build_container_brand_atlases.py'
      - 'gamemodes/legend_of_deborah/content/materials/legend_of_deborah/container_brands/**'
      - 'gamemodes/legend_of_deborah/gamemode/lod/cl_container_branding.lua'
      - 'gamemodes/legend_of_deborah/gamemode/cl_init.lua'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-runtime-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate atlases and renderer wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import struct

          material_dir = Path(
              'gamemodes/legend_of_deborah/content/materials/'
              'legend_of_deborah/container_brands'
          )
          expected_names = [f'container_brand_atlas_{index:02d}.png' for index in range(1, 5)]
          actual_names = sorted(path.name for path in material_dir.glob('container_brand_atlas_*.png'))
          if actual_names != expected_names:
              raise SystemExit(f'atlas set mismatch: {actual_names}')

          for name in expected_names:
              path = material_dir / name
              raw = path.read_bytes()
              if not raw.startswith(b'\x89PNG\r\n\x1a\n') or len(raw) < 33:
                  raise SystemExit(f'{name}: invalid PNG')
              width, height = struct.unpack('>II', raw[16:24])
              bit_depth = raw[24]
              color_type = raw[25]
              if (width, height) != (512, 256):
                  raise SystemExit(f'{name}: expected 512x256, got {width}x{height}')
              if color_type != 3:
                  raise SystemExit(f'{name}: expected indexed-color PNG, color_type={color_type}')
              if b'tRNS' not in raw:
                  raise SystemExit(f'{name}: transparency chunk is missing')
              digest = hashlib.sha256(raw).hexdigest()
              print(f'{name}: {len(raw)} bytes bit_depth={bit_depth} sha256={digest}')

          renderer_path = Path(
              'gamemodes/legend_of_deborah/gamemode/lod/cl_container_branding.lua'
          )
          renderer = renderer_path.read_text(encoding='utf-8')
          required_renderer_tokens = [
              'local BRAND_COUNT = 256',
              'local BRANDS_PER_ATLAS = 64',
              'LOD.Seeds.Derive(seed, "container-brand:v1")',
              'surface.DrawTexturedRectUV(',
              'instance and not instance.marked',
              'hook.Add("PostDrawOpaqueRenderables", "LOD_DrawContainerBranding"',
              'concommand.Add("lod_container_brand_status"',
          ]
          missing = [token for token in required_renderer_tokens if token not in renderer]
          if missing:
              raise SystemExit(f'cl_container_branding.lua missing required wiring: {missing}')

          cl_init = Path('gamemodes/legend_of_deborah/gamemode/cl_init.lua').read_text(encoding='utf-8')
          include = 'include("lod/cl_container_branding.lua")'
          if cl_init.count(include) != 1:
              raise SystemExit('cl_init.lua must include cl_container_branding.lua exactly once')
          marking = 'include("lod/cl_container_marking_panel.lua")'
          if marking not in cl_init or cl_init.index(include) < cl_init.index(marking):
              raise SystemExit('container branding include must follow the marking-panel include')

          print('Container brand runtime validation passed.')
          PY

      - name: Check whitespace
        run: git diff --check HEAD^ HEAD --
