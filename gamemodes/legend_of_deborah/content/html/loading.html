<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>The Legend of Deborah</title>
<style type="text/css">
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;}
#lod{position:absolute;left:0;top:0;width:100%;height:100%;border:0;margin:0;padding:0;}
</style>
</head>
<body marginwidth="0" marginheight="0" leftmargin="0" topmargin="0" bgcolor="#000">
<img id="lod" src="asset://garrysmod/html/legend_of_deborah_loading_compat.jpg" width="100%" height="100%" border="0" alt="The Legend of Deborah">
<script type="text/javascript">
function LODFit(){
  var img=document.getElementById('lod');
  if(!img){return;}
  var w=document.documentElement.clientWidth||document.body.clientWidth||window.innerWidth||screen.width;
  var h=document.documentElement.clientHeight||document.body.clientHeight||window.innerHeight||screen.height;
  if(w&&h){img.width=w;img.height=h;img.style.width=w+'px';img.style.height=h+'px';}
}
window.onload=LODFit;
window.onresize=LODFit;
window.GameDetails=function(){LODFit();};
window.SetFilesTotal=function(){};
window.SetFilesNeeded=function(){};
window.DownloadingFile=function(){};
window.SetStatusChanged=function(){};
</script>
</body>
</html>
