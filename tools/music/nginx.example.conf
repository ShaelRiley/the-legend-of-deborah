# Merge zones into the existing http{} block. Replace example.org and TLS paths.
limit_conn_zone $binary_remote_addr zone=lod_music_clients:10m;
limit_conn_zone $server_name zone=lod_music_total:1m;
limit_req_zone $binary_remote_addr zone=lod_music_uploads:10m rate=2r/m;
server {
    listen 443 ssl;
    server_name music.example.org;
    ssl_certificate /etc/letsencrypt/live/music.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/music.example.org/privkey.pem;
    client_max_body_size 30m;
    client_body_timeout 30s;
    # Eight active responses at 32 KiB/s cap nominal aggregate media egress at
    # 256 KiB/s. Use a separate uplink/CDN or host QoS if gameplay needs more.
    limit_conn lod_music_total 8;
    limit_conn_status 429;
    location ~ "^/music/chunks/[a-f0-9]{64}/[0-9]{1,3}\.dat$" {
        root /srv/lod-music;
        try_files $uri =404;
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        limit_conn lod_music_clients 4;
        limit_conn lod_music_total 8;
        limit_rate 32k;
        gzip off;
        sendfile on;
    }
    location ^~ /music/blocks/ {
        root /srv/lod-music;
        try_files $uri =404;
        types { audio/ogg ogg; }
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        limit_conn lod_music_clients 4;
        limit_rate 32k;
        sendfile on;
    }
    location /v1/ {
        limit_req zone=lod_music_uploads burst=4 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_read_timeout 120s;
        proxy_request_buffering on;
        proxy_set_header Authorization $http_authorization;
    }
    location / { return 404; }
}
